name: Publish Workshop Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build all workshop folders
        uses: actions/jekyll-build-pages@v1
        with:
          source: './'
          destination: './_site'

      - name: Check generated pages
        run: |
          test -s _site/index.html
          test -s '_site/Blue Carbon Workshops/index.html'
          test -s '_site/Blue Carbon Workshops/01_Background/index.html'
          test -s '_site/Blue Carbon Workshops/02_Project_Planning/index.html'
          test -s '_site/Blue Carbon Workshops/03_Field_Methods/index.html'
          test -s '_site/Blue Carbon Workshops/04_Results/index.html'

      - name: Check internal links and images
        run: python3 scripts/check_site.py _site

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
